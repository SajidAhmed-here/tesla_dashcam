name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TZ: UTC

jobs:
  test:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Match the minimum version in setup.py and README.md.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_dev.txt
            requirements_windows.txt
            setup.py

      - name: Install Linux runtime tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg fonts-freefont-ttf libnotify-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build -r requirements.txt -r requirements_dev.txt

      - name: Install Windows notification dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements_windows.txt

      - name: Build source distribution and wheel
        run: python -m build

      - name: Install the built package and check dependencies
        run: |
          python -m pip install dist/*.whl
          python -m pip check

      - name: Run the complete test suite
        run: python -m pytest tests -v

      - name: Check installed CLI entry points
        # Run outside the checkout so imports must come from the installed wheel.
        working-directory: ${{ runner.temp }}
        run: |
          python -m tesla_dashcam --version
          python -m tesla_dashcam --help
          tesla_dashcam --version
          tesla_dashcam --help

      - name: Check FFmpeg encoding and application metadata parsing
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}
        run: |
          ffmpeg -version
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i color=c=black:s=128x96:r=24 -t 1 \
            -c:v libx264 -pix_fmt yuv420p ci-smoke.mp4
          python - <<'PY'
          from tesla_dashcam.tesla_dashcam import get_metadata

          metadata = get_metadata("ffmpeg", ["ci-smoke.mp4"])
          assert len(metadata) == 1, metadata
          assert metadata[0].duration > 0, metadata[0].duration
          assert (metadata[0].width, metadata[0].height) == (128, 96)
          PY
